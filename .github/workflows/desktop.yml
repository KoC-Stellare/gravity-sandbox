# Builds the desktop app: Windows (installer + portable zip) and Linux (AppImage).
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.2.0 to also publish a GitHub Release.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist
            artifact: GravitySandBox-windows
            files: |
              desktop/dist/*.exe
              desktop/dist/*.zip
          - os: ubuntu-latest
            script: dist:linux
            artifact: GravitySandBox-linux
            files: desktop/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.exe
            out/*.zip
            out/*.AppImage
