# Builds the Windows desktop app (installer + portable zip).
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.1.0 to also publish a GitHub Release.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: GravitySandBox-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.zip
